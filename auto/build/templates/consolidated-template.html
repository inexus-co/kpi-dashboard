<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インネクサス｜統合KPIダッシュボード</title>
<style>
:root{ color-scheme: light; --side-w:224px; --bar-h:40px; }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
  background:#f7f5f5; color:#23418c;
}

/* ===== 上部スリムバー（1行に圧縮） ===== */
header.appbar{
  flex:0 0 auto; height:var(--bar-h); display:flex; align-items:center; gap:10px;
  padding:0 14px; color:#fff; z-index:20;
  background:linear-gradient(135deg,#285ac8 0%,#1e46aa 100%);
  box-shadow:0 2px 10px rgba(30,70,170,.18);
}
.menu-btn{
  flex:0 0 auto; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border:0; border-radius:8px; background:rgba(255,255,255,.14); color:#fff; cursor:pointer;
  font-size:15px; line-height:1; transition:.15s;
}
.menu-btn:hover{ background:rgba(255,255,255,.26); }
header.appbar h1{
  margin:0; font-size:14.5px; font-weight:700; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
header.appbar .meta{ margin-left:auto; flex:0 0 auto; font-size:11px; opacity:.85; white-space:nowrap; }

/* ===== 本体（左サイドバー + ステージ） ===== */
.body{ flex:1 1 auto; display:flex; min-height:0; position:relative; }

nav.side{
  flex:0 0 auto; width:var(--side-w); background:#eef2fb; border-right:1px solid #d8e2f6;
  overflow-y:auto; scrollbar-width:thin; padding:8px;
  transition:width .18s ease, transform .18s ease;
}
nav.side::-webkit-scrollbar{ width:7px; }
nav.side::-webkit-scrollbar-thumb{ background:#c7d6f3; border-radius:4px; }
.navitem{
  display:block; width:100%; text-align:left; border:1px solid transparent; background:transparent;
  color:#1e46aa; font-weight:700; font-size:12.5px; padding:9px 11px; border-radius:9px;
  cursor:pointer; white-space:normal; line-height:1.35; margin-bottom:3px; transition:.13s;
}
.navitem:hover{ background:#e2ecff; }
.navitem.active{ background:#285ac8; color:#fff; box-shadow:0 2px 8px rgba(40,90,200,.20); }

main.stage{ flex:1 1 auto; position:relative; background:#fff; min-width:0; }
main.stage iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#fff;
}
.loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#7a8aa8; font-size:13px;
}
.err{ color:#dc1e32; font-size:13px; padding:24px; text-align:center; }

/* ===== 折りたたみ（デスクトップ: 幅0でコンテンツを全幅化） ===== */
body.nav-collapsed nav.side{
  width:0; padding-left:0; padding-right:0; border-right:0; overflow:hidden;
}

/* ===== スクリム（モバイルのオーバーレイ時のみ） ===== */
.scrim{ display:none; }

/* ===== モバイル: サイドバーは左からのオーバーレイ ===== */
@media (max-width:640px){
  nav.side{
    position:absolute; top:0; left:0; bottom:0; z-index:15;
    width:min(78vw,var(--side-w)); transform:translateX(0);
    box-shadow:4px 0 18px rgba(20,40,90,.22);
  }
  body.nav-collapsed nav.side{
    width:min(78vw,var(--side-w)); transform:translateX(-100%);
    padding:8px; border-right:1px solid #d8e2f6; overflow-y:auto;
  }
  .scrim{ position:absolute; inset:0; z-index:12; background:rgba(20,30,60,.28); }
  body:not(.nav-collapsed) .scrim{ display:block; }
}
</style>
</head>
<body>
<header class="appbar">
  <button class="menu-btn" id="menuBtn" aria-label="メニュー開閉" title="メニュー開閉">☰</button>
  <h1>インネクサス｜統合KPIダッシュボード</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="body">
  <nav class="side" id="tabs" role="tablist" aria-label="ダッシュボード一覧"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="stage" id="stage">
    <div class="loading" id="loading">読み込み中…</div>
  </main>
</div>
<script>
const CFG = /*__CFG__*/;

const tabsEl  = document.getElementById('tabs');
const stageEl = document.getElementById('stage');
const metaEl  = document.getElementById('meta');
const menuBtn = document.getElementById('menuBtn');
const scrimEl = document.getElementById('scrim');
const frames  = {}; // id -> iframe (lazy-mounted, kept after first mount)
let activeId  = null;
const mq = window.matchMedia('(max-width:640px)');
const LS_KEY = 'kpi-nav-collapsed';

metaEl.textContent = CFG.updated ? ('最終更新: ' + CFG.updated) : '';

function isMobile(){ return mq.matches; }
function setCollapsed(c){
  document.body.classList.toggle('nav-collapsed', c);
  if (!isMobile()) { try { localStorage.setItem(LS_KEY, c ? '1' : '0'); } catch(e){} }
}
function toggle(){ setCollapsed(!document.body.classList.contains('nav-collapsed')); }

menuBtn.addEventListener('click', toggle);
scrimEl.addEventListener('click', () => setCollapsed(true));

function mount(id){
  if (frames[id]) return frames[id];
  const d = CFG.dashboards.find(x => x.id === id);
  if (!d) return null;
  const f = document.createElement('iframe');
  f.title = d.label;
  f.setAttribute('referrerpolicy','no-referrer');
  f.srcdoc = d.html;           // DOMプロパティで設定（属性エスケープ不要）
  f.style.display = 'none';
  stageEl.appendChild(f);
  frames[id] = f;
  return f;
}

function show(id){
  const f = mount(id);
  if (!f) return;
  Object.keys(frames).forEach(k => { frames[k].style.display = (k === id ? 'block' : 'none'); });
  Array.from(tabsEl.children).forEach(b => b.classList.toggle('active', b.dataset.id === id));
  activeId = id;
  if (isMobile()) setCollapsed(true); // モバイルは選択後にサイドバーを閉じる
}

(function init(){
  const list = (CFG && Array.isArray(CFG.dashboards)) ? CFG.dashboards : [];
  if (!list.length){
    stageEl.innerHTML = '<div class="err">表示できるダッシュボードがありません。</div>';
    return;
  }
  list.forEach(d => {
    const b = document.createElement('button');
    b.className = 'navitem';
    b.textContent = d.label;
    b.dataset.id = d.id;
    b.setAttribute('role','tab');
    b.addEventListener('click', () => show(d.id));
    tabsEl.appendChild(b);
  });
  const lo = document.getElementById('loading'); if (lo) lo.remove();

  // 初期の折りたたみ状態: モバイルは既定で閉じる / デスクトップは前回の選好を復元
  let collapsed;
  if (isMobile()) { collapsed = true; }
  else { try { collapsed = localStorage.getItem(LS_KEY) === '1'; } catch(e){ collapsed = false; } }
  document.body.classList.toggle('nav-collapsed', collapsed);

  show(list[0].id);
})();
</script>
</body>
</html>
