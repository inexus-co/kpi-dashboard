<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インネクサス｜統合KPIダッシュボード</title>
<style>
:root{ color-scheme: light; --side-w:236px; --rail-w:54px; --bar-h:40px; }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
  background:#f7f5f5; color:#23418c;
}

/* ===== 上部スリムバー（1行） ===== */
header.appbar{
  flex:0 0 auto; height:var(--bar-h); display:flex; align-items:center; gap:10px;
  padding:0 14px; color:#fff; z-index:20;
  background:linear-gradient(135deg,#285ac8 0%,#1e46aa 100%);
  box-shadow:0 2px 10px rgba(30,70,170,.18);
}
.menu-btn{
  flex:0 0 auto; height:30px; display:flex; align-items:center; gap:6px;
  padding:0 11px; border:0; border-radius:8px; background:rgba(255,255,255,.14);
  color:#fff; cursor:pointer; font-size:13px; font-weight:700; line-height:1; transition:.15s;
}
.menu-btn:hover{ background:rgba(255,255,255,.26); }
.menu-btn .ic{ font-size:15px; }
header.appbar h1{
  margin:0; flex:0 0 auto; font-size:14px; font-weight:700; letter-spacing:.02em; white-space:nowrap;
}
header.appbar .crumb{
  flex:0 1 auto; min-width:0; font-size:12.5px; font-weight:700; opacity:.96;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
header.appbar .crumb::before{ content:"／"; opacity:.55; margin:0 8px 0 4px; }
header.appbar .meta{ margin-left:auto; flex:0 0 auto; font-size:11px; opacity:.85; white-space:nowrap; }
@media (max-width:560px){
  header.appbar h1, header.appbar .meta{ display:none; }
  header.appbar .crumb::before{ content:none; }
}

/* ===== 本体: コンテンツは常に全幅。サイドバーは左オーバーレイ ===== */
.body{ flex:1 1 auto; position:relative; min-height:0; }

main.stage{ position:absolute; inset:0; background:#fff; }
main.stage iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#fff;
}
.loading{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#7a8aa8; font-size:13px;
}
.err{ color:#dc1e32; font-size:13px; padding:24px; text-align:center; }

/* サイドバー: 既定は細いレール（アイコンのみ）。hoverで --side-w までフル展開。
   コンテンツ幅は奪わずに上へ重なるため、開閉で本文幅は変わらない＝横スクロールを出さない。 */
nav.side{
  position:absolute; top:0; left:0; bottom:0; z-index:15;
  width:var(--rail-w);
  background:#eef2fb; border-right:1px solid #d8e2f6;
  overflow-x:hidden; overflow-y:auto; scrollbar-width:thin; padding:8px;
  transform:translateX(0); transition:width .18s ease, transform .18s ease, box-shadow .18s ease;
  box-shadow:3px 0 12px rgba(20,40,90,.10);
}
nav.side::-webkit-scrollbar{ width:7px; }
nav.side::-webkit-scrollbar-thumb{ background:#c7d6f3; border-radius:4px; }
body.nav-open nav.side{ width:var(--side-w); box-shadow:6px 0 24px rgba(20,40,90,.22); }

.navitem{
  display:flex; align-items:center; gap:9px; width:100%;
  border:1px solid transparent; background:transparent; color:#1e46aa;
  font-weight:700; font-size:12.5px; padding:9px 11px; border-radius:9px;
  cursor:pointer; text-align:left; line-height:1.35; margin-bottom:3px; transition:background .13s, color .13s;
}
.navitem:hover{ background:#e2ecff; }
.navitem.active{ background:#285ac8; color:#fff; box-shadow:0 2px 8px rgba(40,90,200,.20); }
.ni-ic{ flex:0 0 auto; width:22px; text-align:center; font-size:16px; line-height:1; }
.ni-tx{ flex:1 1 auto; min-width:0; white-space:normal; overflow:hidden; }

/* レール状（未展開）: アイコンを中央寄せしラベルは隠す */
body:not(.nav-open) .navitem{ justify-content:center; padding-left:6px; padding-right:6px; }
body:not(.nav-open) .ni-tx{ display:none; }

/* フル展開中だけ出る半透明スクリム（クリックで閉じる） */
.scrim{ position:absolute; inset:0; z-index:12; background:rgba(20,30,60,.28); display:none; }
body.nav-open .scrim{ display:block; }

/* モバイル: レールは出さず、閉状態は完全に隠す。☰タップでフル展開 */
@media (max-width:640px){
  nav.side{ width:min(var(--side-w),82vw); transform:translateX(-100%); box-shadow:4px 0 20px rgba(20,40,90,.22); }
  body.nav-open nav.side{ width:min(var(--side-w),82vw); transform:translateX(0); }
  body:not(.nav-open) .navitem{ justify-content:flex-start; padding-left:11px; padding-right:11px; }
  body:not(.nav-open) .ni-tx{ display:block; }
}
</style>
</head>
<body>
<header class="appbar">
  <button class="menu-btn" id="menuBtn" aria-label="ダッシュボード一覧を開閉" title="ダッシュボード一覧（ホバーで展開）" aria-expanded="false">
    <span class="ic">☰</span><span>一覧</span>
  </button>
  <h1>インネクサス｜統合KPI</h1>
  <span class="crumb" id="crumb"></span>
  <div class="meta" id="meta"></div>
</header>
<div class="body">
  <main class="stage" id="stage">
    <div class="loading" id="loading">読み込み中…</div>
  </main>
  <div class="scrim" id="scrim"></div>
  <nav class="side" id="tabs" role="tablist" aria-label="ダッシュボード一覧"></nav>
</div>
<script>
const CFG = /*__CFG__*/;

const tabsEl  = document.getElementById('tabs');
const stageEl = document.getElementById('stage');
const metaEl  = document.getElementById('meta');
const crumbEl = document.getElementById('crumb');
const menuBtn = document.getElementById('menuBtn');
const scrimEl = document.getElementById('scrim');
const frames  = {}; // id -> iframe (lazy-mounted, kept after first mount)
let activeId  = null;
const hoverCapable = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
let closeTimer = null;

metaEl.textContent = CFG.updated ? ('最終更新: ' + CFG.updated) : '';

// ドロワー開閉。コンテンツはオーバーレイなので開閉しても本文幅は変わらない。
function openNav(){ clearTimeout(closeTimer); document.body.classList.add('nav-open'); menuBtn.setAttribute('aria-expanded','true'); }
function closeNav(){ clearTimeout(closeTimer); document.body.classList.remove('nav-open'); menuBtn.setAttribute('aria-expanded','false'); }
function toggleNav(){ document.body.classList.contains('nav-open') ? closeNav() : openNav(); }
// ホバー外れで少し待ってから閉じる（☰とレールの間を横切る際のちらつき防止）
function scheduleClose(){ clearTimeout(closeTimer); closeTimer = setTimeout(closeNav, 220); }

menuBtn.addEventListener('click', toggleNav);
scrimEl.addEventListener('click', closeNav);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });

// ホバー可能デバイスでは、☰ またはレールにマウスを載せるだけで展開する。
if (hoverCapable){
  menuBtn.addEventListener('mouseenter', openNav);
  menuBtn.addEventListener('mouseleave', scheduleClose);
  tabsEl.addEventListener('mouseenter', openNav);
  tabsEl.addEventListener('mouseleave', scheduleClose);
}

function mount(id){
  if (frames[id]) return frames[id];
  const d = CFG.dashboards.find(x => x.id === id);
  if (!d) return null;
  const f = document.createElement('iframe');
  f.title = d.label;
  f.setAttribute('referrerpolicy','no-referrer');
  f.srcdoc = d.html;           // DOMプロパティで設定（属性エスケープ不要）
  f.style.display = 'none';
  stageEl.appendChild(f);
  frames[id] = f;
  return f;
}

// ダッシュボード表示の切替のみを担う（開閉には触れない）。
function show(id){
  const f = mount(id);
  if (!f) return;
  Object.keys(frames).forEach(k => { frames[k].style.display = (k === id ? 'block' : 'none'); });
  Array.from(tabsEl.children).forEach(b => b.classList.toggle('active', b.dataset.id === id));
  const d = CFG.dashboards.find(x => x.id === id);
  crumbEl.textContent = d ? d.label : '';
  activeId = id;
}

(function init(){
  const list = (CFG && Array.isArray(CFG.dashboards)) ? CFG.dashboards : [];
  if (!list.length){
    stageEl.innerHTML = '<div class="err">表示できるダッシュボードがありません。</div>';
    return;
  }
  list.forEach(d => {
    const b = document.createElement('button');
    b.className = 'navitem';
    b.dataset.id = d.id;
    b.setAttribute('role','tab');
    b.title = d.label;
    const ic = document.createElement('span'); ic.className = 'ni-ic'; ic.textContent = d.icon || '•';
    const tx = document.createElement('span'); tx.className = 'ni-tx'; tx.textContent = d.label;
    b.appendChild(ic); b.appendChild(tx);
    // 項目を選んだらレール状に戻し、全幅のコンテンツを表示する
    b.addEventListener('click', () => { show(d.id); closeNav(); });
    tabsEl.appendChild(b);
  });
  const lo = document.getElementById('loading'); if (lo) lo.remove();

  // 既定はレール状（デスクトップ）/ 非表示（モバイル）で起動。コンテンツは全幅。
  show(list[0].id);
})();
</script>
</body>
</html>
